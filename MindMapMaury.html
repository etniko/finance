<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Knowledge Map</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #0f172a; }
        #root { height: 100%; }
        canvas { display: block; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useEffect, useRef, useState, useMemo } = React;

        const FALLBACK_DATA = {
            id: "business valuation",
            children: [
                { id: "business restructuring", children: [] },
                { id: "cost of capital", children: [
                    { id: "WACC", children: [] },
                    { id: "CAPM", children: [] }
                ] },
                { id: "employee share ownership plans", children: [] },
                { id: "expropriation", children: [] },
                { id: "fair value", children: [] },
                { id: "impairment testing", children: [] },
                { id: "index", children: [] }
            ]
        };

        const App = () => {
            const canvasRef = useRef(null);
            const [nodes, setNodes] = useState([]);
            const [links, setLinks] = useState([]);
            const [selectedNode, setSelectedNode] = useState(null);
            const [showTOC, setShowTOC] = useState(true);
            
            const transform = useRef({ x: 0, y: 0, k: 0.8 });
            const isDragging = useRef(false);
            const dragTarget = useRef(null);
            const lastMousePos = useRef({ x: 0, y: 0 });

            const canAccessParent = () => {
                try {
                    return window.parent && window.parent.location.hostname === window.location.hostname;
                } catch (e) {
                    return false;
                }
            };

            const getTextWidth = (text) => {
                const canvas = document.createElement("canvas");
                const context = canvas.getContext("2d");
                context.font = "13px sans-serif";
                return context.measureText(text).width;
            };

            const getTiddlyWikiData = () => {
                if (canAccessParent()) {
                    try {
                        const tw = window.parent.$tw;
                        if (tw) {
                            const rootTagName = "business valuation";
                            const buildTree = (title, depth = 0) => {
                                const childrenTitles = tw.wiki.filterTiddlers(`[tag[${title}]]`);
                                return {
                                    id: title,
                                    children: childrenTitles.map(childTitle => buildTree(childTitle, depth + 1))
                                };
                            };
                            return buildTree(rootTagName);
                        }
                    } catch (e) {
                        console.warn("TiddlyWiki API access failed:", e);
                    }
                }
                return FALLBACK_DATA;
            };

            useEffect(() => {
                const data = getTiddlyWikiData();
                const newNodes = [];
                const newLinks = [];

                const traverse = (item, parent = null, depth = 0) => {
                    const node = {
                        id: item.id,
                        x: Math.random() * (window.innerWidth * 0.5) + (window.innerWidth * 0.25),
                        y: Math.random() * (window.innerHeight * 0.5) + (window.innerHeight * 0.25),
                        vx: 0,
                        vy: 0,
                        depth,
                        width: getTextWidth(item.id) + 40 // Pre-calculate width for physics
                    };
                    newNodes.push(node);
                    if (parent) {
                        newLinks.push({ source: parent.id, target: node.id });
                    }
                    item.children?.forEach(child => traverse(child, node, depth + 1));
                };

                traverse(data);
                setNodes(newNodes);
                setLinks(newLinks);
            }, []);

            useEffect(() => {
                let animationFrame;
                const simulate = () => {
                    setNodes(prevNodes => {
                        const nextNodes = prevNodes.map(n => ({ ...n }));
                        
                        // 1. DYNAMIC REPULSION (Aware of Node Widths)
                        for (let i = 0; i < nextNodes.length; i++) {
                            for (let j = i + 1; j < nextNodes.length; j++) {
                                const n1 = nextNodes[i];
                                const n2 = nextNodes[j];
                                const dx = n1.x - n2.x;
                                const dy = n1.y - n2.y;
                                const distSq = dx * dx + dy * dy || 1;
                                
                                // Increase repulsion power based on the text width of both nodes
                                const combinedWidth = n1.width + n2.width;
                                const force = (2000 + (combinedWidth * 10)) / distSq; 
                                
                                const dist = Math.sqrt(distSq);
                                const fx = (dx / dist) * force;
                                const fy = (dy / dist) * force;
                                
                                n1.vx += fx;
                                n1.vy += fy;
                                n2.vx -= fx;
                                n2.vy -= fy;
                            }
                        }

                        // 2. ATTRACTION (Links - Increased distance for breathing room)
                        links.forEach(link => {
                            const source = nextNodes.find(n => n.id === link.source);
                            const target = nextNodes.find(n => n.id === link.target);
                            if (!source || !target) return;
                            
                            const dx = target.x - source.x;
                            const dy = target.y - source.y;
                            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                            
                            // Increased ideal distance from 160 to 240 to account for wider labels
                            const force = (dist - 240) * 0.04;
                            const fx = (dx / dist) * force;
                            const fy = (dy / dist) * force;
                            
                            source.vx += fx;
                            source.vy += fy;
                            target.vx -= fx;
                            target.vy -= fy;
                        });

                        // 3. COLLISION PREVENTION (Hard buffer)
                        nextNodes.forEach(n1 => {
                            nextNodes.forEach(n2 => {
                                if (n1 === n2) return;
                                const minBuffer = (n1.width + n2.width) / 2 + 10;
                                const dx = n1.x - n2.x;
                                const dy = n1.y - n2.y;
                                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                                
                                if (dist < minBuffer) {
                                    const push = (minBuffer - dist) * 0.1;
                                    n1.vx += (dx / dist) * push;
                                    n1.vy += (dy / dist) * push;
                                }
                            });
                        });

                        const centerX = window.innerWidth / 2.5;
                        const centerY = (window.innerHeight - 80) / 2;

                        nextNodes.forEach(n => {
                            if (n === dragTarget.current) return;
                            n.vx += (centerX - n.x) * 0.003;
                            n.vy += (centerY - n.y) * 0.003;
                            n.vx *= 0.85; // Friction
                            n.vy *= 0.85;
                            n.x += n.vx;
                            n.y += n.vy;
                        });

                        return nextNodes;
                    });
                    animationFrame = requestAnimationFrame(simulate);
                };

                simulate();
                return () => cancelAnimationFrame(animationFrame);
            }, [links]);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                const render = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.save();
                    ctx.translate(transform.current.x, transform.current.y);
                    ctx.scale(transform.current.k, transform.current.k);

                    links.forEach(link => {
                        const source = nodes.find(n => n.id === link.source);
                        const target = nodes.find(n => n.id === link.target);
                        if (source && target) {
                            ctx.strokeStyle = '#334155';
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(source.x, source.y);
                            ctx.lineTo(target.x, target.y);
                            ctx.stroke();
                        }
                    });

                    nodes.forEach(node => {
                        const isSelected = selectedNode?.id === node.id;
                        
                        ctx.shadowBlur = (node.depth === 0 || isSelected) ? 15 : 0;
                        ctx.shadowColor = isSelected ? '#60a5fa' : '#3b82f6';

                        ctx.fillStyle = '#1e293b';
                        ctx.strokeStyle = isSelected ? '#60a5fa' : '#475569';
                        ctx.lineWidth = isSelected ? 2.5 : 1.5;

                        const padding = 16;
                        const textWidth = node.width - 40;
                        const rectW = textWidth + padding * 2;
                        const rectH = 34;

                        ctx.beginPath();
                        const r = 17;
                        const x = node.x - rectW / 2;
                        const y = node.y - rectH / 2;
                        ctx.roundRect(x, y, rectW, rectH, r);
                        ctx.fill();
                        ctx.stroke();

                        ctx.shadowBlur = 0;
                        ctx.fillStyle = isSelected ? '#fff' : '#cbd5e1';
                        ctx.font = '13px "Segoe UI", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(node.id, node.x, node.y);
                    });

                    ctx.restore();
                };

                render();
            }, [nodes, links, selectedNode]);

            const selectAndNav = (node) => {
                setSelectedNode(node);
                const targetX = (window.innerWidth / 2.5) - (node.x * transform.current.k);
                const targetY = ((window.innerHeight - 80) / 2) - (node.y * transform.current.k);
                transform.current.x = targetX;
                transform.current.y = targetY;

                if (canAccessParent()) {
                    try { window.parent.location.hash = encodeURIComponent(node.id); } 
                    catch (e) { console.warn("Nav blocked."); }
                }
            };

            const handleMouseDown = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                const x = (e.clientX - rect.left - transform.current.x) / transform.current.k;
                const y = (e.clientY - rect.top - transform.current.y) / transform.current.k;

                const clickedNode = nodes.find(n => {
                    const halfW = n.width / 2;
                    return Math.abs(n.x - x) < halfW && Math.abs(n.y - y) < 20;
                });

                if (clickedNode) {
                    dragTarget.current = clickedNode;
                    selectAndNav(clickedNode);
                } else {
                    isDragging.current = true;
                }
                lastMousePos.current = { x: e.clientX, y: e.clientY };
            };

            const handleMouseMove = (e) => {
                if (dragTarget.current) {
                    const rect = canvasRef.current.getBoundingClientRect();
                    dragTarget.current.x = (e.clientX - rect.left - transform.current.x) / transform.current.k;
                    dragTarget.current.y = (e.clientY - rect.top - transform.current.y) / transform.current.k;
                } else if (isDragging.current) {
                    transform.current.x += e.clientX - lastMousePos.current.x;
                    transform.current.y += e.clientY - lastMousePos.current.y;
                }
                lastMousePos.current = { x: e.clientX, y: e.clientY };
            };

            const handleMouseUp = () => {
                dragTarget.current = null;
                isDragging.current = false;
            };

            const sortedNodes = useMemo(() => [...nodes].sort((a,b) => a.id.localeCompare(b.id)), [nodes]);

            return (
                <div className="flex flex-col w-full h-screen bg-slate-900 text-slate-100 overflow-hidden font-sans">
                    <header className="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center shrink-0 z-20">
                        <div>
                            <h1 className="text-xl font-bold text-blue-400">Finance Knowledge Map</h1>
                            <p className="text-xs text-slate-400">Smart collision prevention enabled • {nodes.length} concepts mapped</p>
                        </div>
                        <div className="flex items-center gap-4">
                            <button onClick={() => setShowTOC(!showTOC)} className="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded border border-slate-500">
                                {showTOC ? "Hide TOC" : "Show TOC"}
                            </button>
                        </div>
                    </header>

                    <main className="relative flex-grow flex overflow-hidden">
                        <canvas
                            ref={canvasRef}
                            width={window.innerWidth}
                            height={window.innerHeight - 80}
                            onMouseDown={handleMouseDown}
                            onMouseMove={handleMouseMove}
                            onMouseUp={handleMouseUp}
                            onMouseLeave={handleMouseUp}
                            className="w-full h-full cursor-grab active:cursor-grabbing"
                        />

                        {showTOC && (
                            <div className="absolute right-6 top-6 bottom-6 w-64 bg-slate-900/80 backdrop-blur-md border border-slate-700 rounded-lg shadow-2xl flex flex-col z-10">
                                <div className="p-4 border-b border-slate-700">
                                    <h3 className="text-sm font-bold text-slate-300 uppercase tracking-widest">Concepts</h3>
                                </div>
                                <div className="flex-grow overflow-y-auto p-2 custom-scrollbar">
                                    {sortedNodes.map(node => (
                                        <div 
                                            key={node.id}
                                            onClick={() => selectAndNav(node)}
                                            className={`p-2 mb-1 text-xs rounded cursor-pointer transition-colors flex items-center gap-2 ${selectedNode?.id === node.id ? 'bg-blue-600/20 text-blue-300 border-l-2 border-blue-500' : 'hover:bg-slate-800 text-slate-400'}`}
                                        >
                                            <span className="opacity-30">•</span>
                                            {node.id}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="absolute bottom-6 left-6 flex flex-col gap-2">
                            <button onClick={() => transform.current.k *= 1.2} className="w-10 h-10 bg-slate-800/80 hover:bg-slate-700 rounded-full border border-slate-600 flex items-center justify-center shadow-lg">+</button>
                            <button onClick={() => transform.current.k /= 1.2} className="w-10 h-10 bg-slate-800/80 hover:bg-slate-700 rounded-full border border-slate-600 flex items-center justify-center shadow-lg">-</button>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
