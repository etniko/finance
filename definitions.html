<!doctype html>
<html lang="en">
<head>
<meta http-equiv="ContentType" content="text/html;charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Valuation Definitions Wiki</title>
<style>
  :root {
    --nord0: #2e3440; --nord1: #3b4252; --nord2: #434c5e; --nord3: #4c566a;
    --nord4: #d8dee9; --nord5: #e5e9f0; --nord6: #eceff4;
    --nord7: #8fbcbb; --nord8: #88c0d0; --nord9: #81a1c1; --nord10: #5e81ac;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; display: flex; height: 100vh; background: var(--nord0); color: var(--nord4); overflow: hidden; }

  /* Sidebar */
  #sidebar {
    width: 260px; min-width: 260px; background: #252b36;
    display: flex; flex-direction: column; border-right: 1px solid var(--nord1);
    transition: width 0.3s;
  }
  #sidebar.collapsed { width: 0; min-width: 0; border: none; overflow: hidden; }
  
  #sidebar h2 {
    padding: 70px 20px 15px; font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 2px; color: var(--nord8); border-bottom: 1px solid var(--nord1);
  }

  #sidebar nav { flex: 1; overflow-y: auto; padding-top: 10px; }
  #sidebar nav a {
    display: flex; align-items: center; gap: 10px; padding: 12px 20px;
    color: var(--nord7); text-decoration: none; font-size: 0.85rem;
    border-left: 3px solid transparent; transition: 0.2s;
  }
  #sidebar nav a:hover, #sidebar nav a.active {
    background: var(--nord1); border-left-color: var(--nord8); color: var(--nord6);
  }

  /* Main Area */
  #main { flex: 1; overflow-y: auto; padding: 40px; position: relative; }
  
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-left: 40px; margin-bottom: 30px;
  }
  h1 { font-size: 1.6rem; color: var(--nord8); font-weight: 400; }

  .btn {
    padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer;
    font-size: 0.85rem; font-weight: 500; transition: 0.2s;
  }
  .btn-primary { background: var(--nord10); color: white; }
  .btn-primary:hover { background: var(--nord9); }
  .btn-save { background: var(--nord7); color: var(--nord0); margin-left: 10px; }

  /* Tiddler Cards */
  .tiddler {
    background: #2a3040; border: 1px solid var(--nord1);
    border-radius: 8px; padding: 25px; margin-bottom: 20px;
    animation: fadeIn 0.3s ease-out;
  }
  .tiddler-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
  .tiddler-title { font-size: 1.1rem; color: var(--nord6); }
  .tiddler-body { font-size: 0.95rem; color: #9aacb8; line-height: 1.6; white-space: pre-wrap; }

  .actions { display: flex; gap: 10px; }
  .action-link { color: var(--nord3); cursor: pointer; font-size: 0.8rem; text-decoration: underline; }
  .action-link:hover { color: var(--nord8); }

  /* Modal */
  #modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    z-index: 1000; justify-content: center; align-items: center;
  }
  .modal { background: var(--nord0); padding: 30px; border-radius: 8px; width: 500px; border: 1px solid var(--nord1); }
  .modal h3 { margin-bottom: 20px; color: var(--nord8); }
  input, textarea {
    width: 100%; background: var(--nord1); border: 1px solid var(--nord3);
    padding: 12px; color: white; border-radius: 4px; margin-bottom: 15px; font-family: inherit;
  }
  textarea { height: 150px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div id="sidebar">
  <h2>Definitions</h2>
  <nav id="nav-list"></nav>
</div>

<div id="main">
  <div class="top-bar">
    <h1>Valuation Terms</h1>
    <div>
        <button class="btn btn-primary" onclick="openEditor()">+ New Tiddler</button>
        <button class="btn btn-save" onclick="downloadWiki()">💾 Save to File</button>
    </div>
  </div>

  <div id="story-river"></div>
</div>

<div id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title">Edit Tiddler</h3>
    <input type="hidden" id="edit-id">
    <input type="text" id="input-title" placeholder="Title">
    <textarea id="input-body" placeholder="Content..."></textarea>
    <div style="display:flex; justify-content: flex-end; gap: 10px;">
        <button class="btn" style="background: var(--nord3); color: white;" onclick="closeEditor()">Cancel</button>
        <button class="btn btn-primary" onclick="saveTiddler()">Save</button>
    </div>
  </div>
</div>

<script>
  // Initial Tiddlers
  let tiddlers = [
    { title: 'No Compulsion to Transact', body: 'A business has been losing money and may be in jeopardy of going out of business; thus, it may be a motivated vendor. This compulsion weakens the seller\'s negotiating position.' },
    { title: 'Negotiating Abilities', body: 'A potential buyer has completed many acquisitions, while a seller may be inexperienced. The potential buyer may be a better negotiator, suggesting the seller should utilize professional help.' },
    { title: 'Restricted Market', body: 'The business (seller) may be dealing with only one buyer. A restricted market limits competition, removing upward pricing pressure.' }
  ];

  // Load from local storage if available
  const stored = localStorage.getItem('valuation_wiki_data');
  if(stored) tiddlers = JSON.parse(stored);

  let currentView = 'all';

  function render() {
    const nav = document.getElementById('nav-list');
    const river = document.getElementById('story-river');
    
    nav.innerHTML = `<a href="#" class="${currentView === 'all' ? 'active' : ''}" onclick="setView('all')">Recent All</a>`;
    river.innerHTML = '';

    tiddlers.forEach((t, i) => {
      // Sidebar
      const link = document.createElement('a');
      link.innerText = t.title;
      link.className = currentView === i ? 'active' : '';
      link.onclick = () => setView(i);
      nav.appendChild(link);

      // Story River
      if (currentView === 'all' || currentView === i) {
        const card = document.createElement('div');
        card.className = 'tiddler';
        card.innerHTML = `
          <div class="tiddler-header">
            <div class="tiddler-title">${t.title}</div>
            <div class="actions">
                <span class="action-link" onclick="openEditor(${i})">edit</span>
                <span class="action-link" onclick="deleteTiddler(${i})">delete</span>
            </div>
          </div>
          <div class="tiddler-body">${t.body}</div>
        `;
        river.appendChild(card);
      }
    });
  }

  function setView(v) {
    currentView = v;
    render();
  }

  function openEditor(index = null) {
    document.getElementById('modal-overlay').style.display = 'flex';
    if(index !== null) {
        document.getElementById('edit-id').value = index;
        document.getElementById('input-title').value = tiddlers[index].title;
        document.getElementById('input-body').value = tiddlers[index].body;
        document.getElementById('modal-title').innerText = "Edit Tiddler";
    } else {
        document.getElementById('edit-id').value = "";
        document.getElementById('input-title').value = "";
        document.getElementById('input-body').value = "";
        document.getElementById('modal-title').innerText = "New Tiddler";
    }
  }

  function closeEditor() {
    document.getElementById('modal-overlay').style.display = 'none';
  }

  function saveTiddler() {
    const id = document.getElementById('edit-id').value;
    const title = document.getElementById('input-title').value;
    const body = document.getElementById('input-body').value;

    if(!title) return;

    if(id === "") {
        tiddlers.unshift({title, body});
    } else {
        tiddlers[id] = {title, body};
    }

    localStorage.setItem('valuation_wiki_data', JSON.stringify(tiddlers));
    closeEditor();
    render();
  }

  function deleteTiddler(i) {
    if(confirm("Delete this tiddler?")) {
        tiddlers.splice(i, 1);
        localStorage.setItem('valuation_wiki_data', JSON.stringify(tiddlers));
        currentView = 'all';
        render();
    }
  }

  function downloadWiki() {
    // This creates a "snapshot" of the HTML with the current data hardcoded
    const dataString = JSON.stringify(tiddlers, null, 2);
    let htmlContent = document.documentElement.outerHTML;
    
    // Replace the initial tiddlers array in the script with the current data
    const regex = /let tiddlers = \[[\s\S]*?\];/;
    htmlContent = htmlContent.replace(regex, `let tiddlers = ${dataString};`);

    const blob = new Blob([htmlContent], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'valuation_wiki_updated.html';
    a.click();
  }

  render();
</script>
</body>
</html>
