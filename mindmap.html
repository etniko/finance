<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Model MindMap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a1628; color: #e2e8f0; }

        .node {
            transition: transform 0.2s ease-out;
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            text-align: center;
            border: 3px solid rgba(255,255,255,0.15);
            box-shadow: 0 0 18px rgba(99,179,255,0.25), 0 4px 15px rgba(0,0,0,0.5);
            user-select: none;
            z-index: 20;
            background-clip: padding-box;
            cursor: grab;
        }
        .node:hover {
            transform: translate(-50%, -50%) scale(1.08) !important;
            box-shadow: 0 0 28px rgba(99,179,255,0.5), 0 4px 20px rgba(0,0,0,0.6);
        }
        .connector {
            position: absolute;
            background: rgba(99,179,255,0.25);
            height: 2px;
            transform-origin: left center;
            z-index: 5;
            pointer-events: none;
        }
        .sidebar-node {
            border-left: 1px solid #1e3a5f;
            margin-left: 0.75rem;
            padding-left: 0.5rem;
        }

        aside {
            background-color: #0d1f3c;
            border-right: 1px solid #1e3a5f;
        }
        #sidebar-content .node-row:hover {
            background-color: #1a2f4e;
        }
        input.sidebar-input {
            background: transparent;
            border: none;
            outline: none;
            color: #cbd5e1;
            width: 100%;
            font-size: 0.875rem;
            font-weight: 500;
        }
        input.sidebar-input:focus {
            color: #93c5fd;
        }

        #canvas {
            background-color: #0a1628;
            background-image: radial-gradient(rgba(99,179,255,0.15) 1px, transparent 1px);
            background-size: 22px 22px;
        }

        #sidebar-content::-webkit-scrollbar { width: 5px; }
        #sidebar-content::-webkit-scrollbar-track { background: #0d1f3c; }
        #sidebar-content::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 4px; }

        .btn-primary {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary:hover { background: linear-gradient(135deg, #2563eb, #3b82f6); box-shadow: 0 0 12px rgba(59,130,246,0.4); }
        .btn-secondary {
            background: #1a2f4e;
            color: #93c5fd;
            border: 1px solid #1e3a5f;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-secondary:hover { background: #1e3a5f; }
        .btn-save {
            background: linear-gradient(135deg, #065f46, #047857);
            color: #6ee7b7;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .btn-save:hover { background: linear-gradient(135deg, #047857, #059669); box-shadow: 0 0 12px rgba(16,185,129,0.35); }
    </style>
</head>
<body class="font-sans h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-80 flex flex-col shadow-2xl z-30">
        <div class="p-5 border-b border-[#1e3a5f]">
            <h1 class="text-lg font-bold text-blue-200 tracking-wide">🧠 MindMap Editor</h1>
            <p class="text-xs text-slate-500 mt-1">Dark mode · Collision-aware layout</p>
        </div>

        <div id="sidebar-content" class="flex-1 overflow-y-auto p-4 space-y-1">
            <!-- Tree injected here -->
        </div>

        <div class="p-4 border-t border-[#1e3a5f] grid grid-cols-2 gap-2">
            <button onclick="exportData()" class="btn-primary">⬇ Export JSON</button>
            <button onclick="document.getElementById('import-input').click()" class="btn-secondary">⬆ Import JSON</button>
            <button onclick="saveHTML()" class="btn-save col-span-2">💾 Save as HTML</button>
            <input type="file" id="import-input" class="hidden" accept=".json" onchange="importData(event)">
        </div>
    </aside>

    <!-- Canvas -->
    <main id="canvas" class="flex-1 relative overflow-hidden">
        <div id="mindmap-root" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full">
        </div>
    </main>

    <script id="mindmap-data-script">
        const COLORS = [
            '#3b82f6','#6366f1','#8b5cf6','#ec4899',
            '#14b8a6','#0ea5e9','#f59e0b','#10b981',
            '#f43f5e','#a78bfa'
        ];

        // MINDMAP_DATA_PLACEHOLDER — do not remove this comment, it is used by saveHTML()
        let mindmapData = {"id":"root","label":"cover page ","color":"#3b82f6","x":0,"y":0,"vx":0,"vy":0,"children":[{"id":"1","label":"Singapore","color":"#6366f1","children":[{"id":"1-1","label":"Documents","color":"#8b5cf6","children":[]},{"id":"1-2","label":"Budget","color":"#0ea5e9","children":[]},{"id":"1-3","label":"Flights","color":"#14b8a6","children":[]},{"id":"1-4","label":"Hotels","color":"#10b981","children":[]}]}]};

        // ── Physics constants ──────────────────────────────────────────
        const DAMPING       = 0.88;
        const SPRING_K      = 0.03;
        const IDEAL_DIST    = 190;
        const REPULSE_K     = 18000;
        const GRAVITY       = 0.04;

        function getRadius(depth) { return depth === 0 ? 60 : 45; }

        function initializeNodePositions(node, depth = 0, angle = 0) {
            if (typeof node.x !== 'number') {
                const dist = depth * IDEAL_DIST;
                node.x = Math.cos(angle) * dist;
                node.y = Math.sin(angle) * dist;
            }
            node.vx = node.vx || 0;
            node.vy = node.vy || 0;
            node._depth = depth;
            node.children.forEach((child, i) => {
                const a = (i / node.children.length) * 2 * Math.PI;
                initializeNodePositions(child, depth + 1, a);
            });
        }

        function flattenNodes(node, arr = []) {
            arr.push(node);
            node.children.forEach(c => flattenNodes(c, arr));
            return arr;
        }

        function simulate() {
            const allNodes = flattenNodes(mindmapData);

            function tagDepth(node, d = 0) {
                node._depth = d;
                node.children.forEach(c => tagDepth(c, d + 1));
            }
            tagDepth(mindmapData);

            function applyForces(node, parent = null) {
                const distC = Math.sqrt(node.x * node.x + node.y * node.y);
                if (distC > 1) {
                    node.vx -= (node.x / distC) * GRAVITY;
                    node.vy -= (node.y / distC) * GRAVITY;
                }
                if (parent) {
                    const dx = node.x - parent.x;
                    const dy = node.y - parent.y;
                    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    const force = (dist - IDEAL_DIST) * SPRING_K;
                    node.vx -= (dx / dist) * force;
                    node.vy -= (dy / dist) * force;
                    parent.vx += (dx / dist) * force * 0.5;
                    parent.vy += (dy / dist) * force * 0.5;
                }
                node.children.forEach(child => applyForces(child, node));
            }

            function applyRepulsion() {
                for (let i = 0; i < allNodes.length; i++) {
                    for (let j = i + 1; j < allNodes.length; j++) {
                        const a = allNodes[i];
                        const b = allNodes[j];
                        const dx = b.x - a.x;
                        const dy = b.y - a.y;
                        const dist = Math.sqrt(dx * dx + dy * dy) || 0.1;
                        const minDist = getRadius(a._depth) + getRadius(b._depth) + 12;

                        if (dist < minDist * 2.5) {
                            const force = REPULSE_K / (dist * dist);
                            const fx = (dx / dist) * force;
                            const fy = (dy / dist) * force;
                            a.vx -= fx * 0.01;
                            a.vy -= fy * 0.01;
                            b.vx += fx * 0.01;
                            b.vy += fy * 0.01;

                            if (dist < minDist) {
                                const overlap = (minDist - dist) / 2;
                                a.x -= (dx / dist) * overlap;
                                a.y -= (dy / dist) * overlap;
                                b.x += (dx / dist) * overlap;
                                b.y += (dy / dist) * overlap;
                            }
                        }
                    }
                }
            }

            function updatePositions(node) {
                if (node.id !== 'root') {
                    node.vx *= DAMPING;
                    node.vy *= DAMPING;
                    node.x  += node.vx;
                    node.y  += node.vy;
                } else {
                    node.x *= 0.9;
                    node.y *= 0.9;
                }
                node.children.forEach(updatePositions);
            }

            applyForces(mindmapData);
            applyRepulsion();
            updatePositions(mindmapData);
            renderMap();
            requestAnimationFrame(simulate);
        }

        function render() {
            initializeNodePositions(mindmapData);
            renderSidebar();
            simulate();
        }

        // ── Sidebar ────────────────────────────────────────────────────
        function renderSidebar() {
            const c = document.getElementById('sidebar-content');
            c.innerHTML = '';
            c.appendChild(createSidebarNode(mindmapData));
        }

        function createSidebarNode(node) {
            const wrap = document.createElement('div');
            wrap.className = 'space-y-1';

            const row = document.createElement('div');
            row.className = 'node-row flex items-center gap-2 p-1.5 rounded-lg group cursor-default';

            const dot = document.createElement('div');
            dot.className = 'w-3 h-3 rounded-full shrink-0';
            dot.style.backgroundColor = node.color;

            const inp = document.createElement('input');
            inp.value = node.label;
            inp.className = 'sidebar-input';
            inp.oninput = e => { node.label = e.target.value; };

            const btns = document.createElement('div');
            btns.className = 'hidden group-hover:flex gap-1';

            const addBtn = document.createElement('button');
            addBtn.innerHTML = '+';
            addBtn.title = 'Add child';
            addBtn.style.cssText = 'color:#60a5fa;font-size:1rem;font-weight:700;padding:0 4px;background:none;border:none;cursor:pointer;';
            addBtn.onclick = () => {
                node.children.push({
                    id: Date.now().toString(),
                    label: 'New Node',
                    color: COLORS[Math.floor(Math.random() * COLORS.length)],
                    x: node.x + (Math.random() - 0.5) * 60,
                    y: node.y + (Math.random() - 0.5) * 60,
                    vx: 0, vy: 0, children: []
                });
                renderSidebar();
            };

            const delBtn = document.createElement('button');
            delBtn.innerHTML = '×';
            delBtn.title = 'Delete node';
            delBtn.style.cssText = 'color:#f87171;font-size:1rem;font-weight:700;padding:0 4px;background:none;border:none;cursor:pointer;';
            delBtn.onclick = () => {
                deleteNodeRecursive(mindmapData, node.id);
                renderSidebar();
            };

            btns.appendChild(addBtn);
            if (node.id !== 'root') btns.appendChild(delBtn);

            row.appendChild(dot);
            row.appendChild(inp);
            row.appendChild(btns);
            wrap.appendChild(row);

            if (node.children.length > 0) {
                const kids = document.createElement('div');
                kids.className = 'sidebar-node';
                node.children.forEach(c => kids.appendChild(createSidebarNode(c)));
                wrap.appendChild(kids);
            }
            return wrap;
        }

        function deleteNodeRecursive(parent, id) {
            parent.children = parent.children.filter(c => c.id !== id);
            parent.children.forEach(c => deleteNodeRecursive(c, id));
        }

        // ── Canvas rendering ───────────────────────────────────────────
        function renderMap() {
            const container = document.getElementById('mindmap-root');
            container.innerHTML = '';
            drawNode(mindmapData, container, 0);
        }

        function drawNode(node, container, depth) {
            const nx = node.x || 0, ny = node.y || 0;

            node.children.forEach(child => {
                const cx = child.x || 0, cy = child.y || 0;
                const dx = cx - nx, dy = cy - ny;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx);

                const r1 = getRadius(depth);
                const r2 = getRadius(depth + 1);
                const shortenedDist = Math.max(0, dist - r1 - r2);
                const offsetX = (dx / dist) * r1;
                const offsetY = (dy / dist) * r1;

                const line = document.createElement('div');
                line.className = 'connector';
                line.style.width  = shortenedDist + 'px';
                line.style.left   = `calc(50% + ${nx + offsetX}px)`;
                line.style.top    = `calc(50% + ${ny + offsetY}px)`;
                line.style.transform = `rotate(${angle}rad)`;
                container.appendChild(line);

                drawNode(child, container, depth + 1);
            });

            const el = document.createElement('div');
            el.className = 'node';
            el.innerText = node.label;
            el.style.backgroundColor = node.color;
            const size = getRadius(depth) * 2;
            el.style.width  = size + 'px';
            el.style.height = size + 'px';
            el.style.fontSize = depth === 0 ? '14px' : '11px';
            el.style.left = `calc(50% + ${nx}px)`;
            el.style.top  = `calc(50% + ${ny}px)`;
            el.style.transform = 'translate(-50%, -50%)';
            container.appendChild(el);
        }

        // ── Save as HTML (embeds current mindmapData into a fresh copy of this file) ──
        function saveHTML() {
            // Cleanly strip simulation-only properties before saving
            function cleanNode(node) {
                return {
                    id: node.id,
                    label: node.label,
                    color: node.color,
                    x: Math.round(node.x) || 0,
                    y: Math.round(node.y) || 0,
                    vx: 0, vy: 0,
                    children: node.children.map(cleanNode)
                };
            }
            const cleanData = cleanNode(mindmapData);
            const dataJSON  = JSON.stringify(cleanData);

            // Grab the full HTML source and replace only the data line
            let html = document.documentElement.outerHTML;

            // Replace the let mindmapData = {...}; line with fresh data
            html = html.replace(
                /let mindmapData\s*=\s*(\{[\s\S]*?\});/,
                `let mindmapData = ${dataJSON};`
            );

            const blob = new Blob([html], { type: 'text/html' });
            const url  = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href     = url;
            link.download = `mindmap-${Date.now()}.html`;
            link.click();
            URL.revokeObjectURL(url);
        }

        // ── JSON Export / Import ───────────────────────────────────────
        function exportData() {
            const blob = new Blob([JSON.stringify(mindmapData, null, 2)], { type: 'application/json' });
            const url  = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url; link.download = 'mindmap.json'; link.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                mindmapData = JSON.parse(ev.target.result);
                initializeNodePositions(mindmapData);
                renderSidebar();
            };
            reader.readAsText(file);
        }

        window.onload = render;
    </script>
</body>
</html>
